<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="mascotes/nex.jpg"><style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Nexus CRM Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: menu lateral estreito em grupos (Principal, Operações, Gestão), item ativo em pílula azul-cobalto sobre azul-marinho, ouro só na marca; cada tela abre com ícone + título + ações à direita; ações abrem janelas sobrepostas */
:root{
  color-scheme:dark;
  --bg:#0B1120; --lado:#0D1526; --painel:#131C31; --painel2:#182340; --painel3:#1F2D52; --linha:#1F2A48;
  --texto:#F8FAFC; --suave:#A9B4CC; --fraco:#8592AD;
  --acao:#2B66F6; --acao2:#93BBFF; --acaofundo:#152A55; --acaolinha:#2B4A8C;
  --ok:#34D399; --okfundo:#12302A; --alerta:#FBBF24; --alertafundo:#33280F; --perigo:#F87171; --perigofundo:#3A1A22;
  --azul:#38BDF8; --ciano:#2DD4BF; --marcaouro:#E6C36A; --sombra:#0009;
  --f-marca:"Michroma",ui-sans-serif,system-ui,sans-serif;
  --f:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
body.claro{
  color-scheme:light;
  --bg:#F3F6FB; --lado:#FFFFFF; --painel:#FFFFFF; --painel2:#F5F8FD; --painel3:#E9EEF7; --linha:#DDE4F0;
  --texto:#111A2E; --suave:#4B5873; --fraco:#64718C;
  --acao:#2563EB; --acao2:#1D4ED8; --acaofundo:#E6EEFE; --acaolinha:#BBD0FB;
  --ok:#0F8A5F; --okfundo:#E1F6EC; --alerta:#A16207; --alertafundo:#FDF3D7; --perigo:#C8322B; --perigofundo:#FCE8E6;
  --azul:#0284C7; --ciano:#0D9488; --marcaouro:#9C7128; --sombra:#111a2e33;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--texto);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3,p,ul,ol{margin:0} ul,ol{padding:0;list-style:none}
h1{font-size:19px;font-weight:700;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--acao2);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.suave{color:var(--suave)} .ok{color:var(--ok)} .alerta{color:var(--alerta)} .perigo{color:var(--perigo)} .roxo{color:var(--acao2)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:100%}
body.rec .app{grid-template-columns:60px minmax(0,1fr)}
.lado{background:var(--lado);border-right:1px solid var(--linha);padding:8px 6px;display:flex;flex-direction:column;gap:1px;position:sticky;top:0;height:100vh;overflow:auto}
.marca{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.marca svg.logo{width:30px;height:30px;flex:none}
.marca b{font:400 11.5px var(--f-marca);letter-spacing:.22em;color:var(--marcaouro);display:block}
.marca small{font:400 11px var(--f-marca);letter-spacing:.24em;color:var(--suave)}
.marca .rc{margin-left:auto;background:none;border:0;color:var(--suave);padding:4px}
.empresa{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--bg);border:1px solid var(--linha);border-radius:8px;padding:7px 9px;margin:0 0 8px;text-align:left;width:100%}
.empresa b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:138px}
.empresa span span{font-size:11px;color:var(--suave)}
.grupo{font-size:11px;color:var(--fraco);letter-spacing:.05em;text-transform:uppercase;padding:10px 6px 4px;font-weight:600}
.lado a.it{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:6px;color:var(--texto);font-weight:500;font-size:12.5px;white-space:nowrap;transition:background .15s}
.lado a.it:hover{background:var(--painel2)}
.lado a.it.on{background:var(--acao);color:#fff;font-weight:600}
.lado .q{margin-left:auto;font-size:11px;font-weight:700;background:var(--painel3);padding:1px 6px;border-radius:99px}
.lado a.on .q{background:#ffffff33}
.pe{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid var(--linha)}
.saldo{border:1px solid #7A5A1E;border-radius:6px;padding:6px 8px;font-size:11.5px;font-weight:600;background:none;text-align:left}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.duo .bt{justify-content:center;padding:5px;font-size:11.5px;border-radius:5px}
.tema{display:flex;align-items:center;gap:8px;border:1px solid var(--linha);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:12.5px;width:100%;text-align:left}
.tema small{display:block;font-size:11px;color:var(--fraco)}
.tema .sn{margin-left:auto;background:none;border:0;padding:4px}
.perfil{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;background:none;border:0;text-align:left;width:100%}
.perfil:hover{background:var(--painel2)}
.perfil b{font-size:11.5px;display:block} .perfil span span{font-size:11px;color:var(--suave);display:block;max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;background:#2563EB;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.exemplo{font-size:11px;color:var(--fraco);text-align:center}
body.rec .lado .tx,body.rec .grupo,body.rec .empresa,body.rec .saldo,body.rec .duo,body.rec .exemplo,body.rec .marca div,body.rec .tema>span,body.rec .lado .q{display:none}
body.rec .lado a.it{justify-content:center;padding:8px}

main{padding-block:20px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hd .tt{display:flex;gap:10px;align-items:flex-start;min-width:0}
.hd .tt>svg.i{width:20px;height:20px;margin-top:6px}
.hd p{color:var(--suave);font-size:13px;margin-top:3px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bt{background:var(--painel);border:1px solid var(--linha);padding:7px 13px;border-radius:7px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;transition:border-color .15s,background .15s,filter .15s}
.bt:hover{border-color:var(--acaolinha)}
.bt.pri{background:var(--acao);border-color:var(--acao);color:#fff}
.bt.pri:hover{filter:brightness(1.12)}
.bt.amb{background:#F59E0B;border-color:#F59E0B;color:#1A1205}
.bt.per{color:var(--perigo)} .bt.ic{padding:7px 8px}
.bt.verde{color:var(--ok);border-color:#1F5A47;background:none;justify-content:center;width:100%}
.lk{background:none;border:0;color:var(--acao2);font-weight:500;font-size:13px;padding:2px}
.lk.per{color:var(--perigo)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--linha);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:5px 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--suave)}
.seg button.on{background:var(--acao);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips button{background:var(--painel);border:1px solid var(--linha);padding:4px 10px;border-radius:6px;font-weight:600;font-size:11.5px;display:inline-flex;gap:6px;align-items:center}
.chips button.on{background:var(--acao);border-color:var(--acao);color:#fff}
.chips i{width:6px;height:6px;border-radius:50%}
select.c,input.c,textarea.c{background:var(--painel);border:1px solid var(--linha);border-radius:7px;padding:8px 10px;color:var(--texto);font:inherit;font-size:13px;min-width:0;max-width:100%}
textarea.c{min-height:74px;resize:vertical;width:100%}
input.c:focus,select.c:focus,textarea.c:focus{border-color:var(--acao);outline:none}
.bus{position:relative;display:flex;flex:1;min-width:160px}
.bus svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fraco)}
.bus input{padding-left:32px;width:100%}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linha .fim{margin-left:auto;display:flex;gap:6px;align-items:center}
.barra{background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.barra .fim{margin-left:auto;display:flex;gap:6px;align-items:center}
.grp{display:inline-flex;border:1px solid var(--linha);border-radius:7px;background:var(--bg)}
.grp button{background:none;border:0;padding:7px 8px}

.card{background:var(--painel);border:1px solid var(--linha);border-radius:8px;min-width:0}
.card>header{padding:16px 18px 4px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.card>header h2{font-size:15px;font-weight:700}
.card>header p{font-size:12.5px;color:var(--suave);margin-top:2px}
.pad{padding:14px 18px}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)} .g11{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:1px;min-width:0;position:relative;transition:transform .15s,border-color .15s}
.kpi:hover{transform:translateY(-2px);border-color:var(--acaolinha)}
.kpi .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.chip{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;flex:none}
.chip.g{width:30px;height:30px;border-radius:7px;background:var(--acao);color:#fff}
.var{font-size:11px;font-weight:600;background:var(--painel3);padding:2px 7px;border-radius:5px;color:var(--suave)}
.kpi b{font-size:17px;font-weight:700}
.kpi span.r{font-size:12.5px;font-weight:600;color:var(--suave)}
.kpi .inf{position:absolute;right:12px;bottom:10px;color:var(--fraco)}
.st3{background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.st3 span{font-size:13px;color:var(--suave)} .st3 b{display:block;font-size:20px} .st3 small{color:var(--suave);font-size:11.5px}
.st4{background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:10px 12px}
.st4 b{font-size:16px} .st4 span{display:block;font-size:11px;color:var(--suave);text-transform:uppercase;font-weight:600;letter-spacing:.03em;margin-top:2px}
.graf svg{display:block;width:100%;height:auto}
.graf text{font:11px var(--f);fill:var(--fraco)}
.hb{display:flex;flex-direction:column;gap:10px}
.hb div{display:grid;grid-template-columns:100px minmax(0,1fr) 88px;gap:10px;align-items:center;font-size:13px}
.hb i{display:block;height:8px;border-radius:4px;background:var(--acao)}
.hb em{font-style:normal;background:var(--painel3);border-radius:4px;display:block}
.hb b{text-align:right;font-weight:600}
.tabela{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:10px 14px;text-align:left;border-bottom:1px solid var(--linha);white-space:nowrap}
th{font-weight:600;color:var(--fraco);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
tbody tr{transition:background .15s} tbody tr:hover{background:var(--painel2)}
tr:last-child td{border-bottom:0}
.dir{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--painel3);color:var(--suave);white-space:nowrap}
.pill.ok{background:var(--okfundo);color:var(--ok);border:1px solid #1F5A47} .pill.alerta{background:var(--alertafundo);color:var(--alerta);border:1px solid #6B5318} .pill.perigo{background:var(--perigofundo);color:var(--perigo)} .pill.roxo{background:var(--acaofundo);color:var(--acao2)}
.vazio{padding:44px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;border:1px dashed var(--linha);border-radius:8px}
.vazio>svg.i{width:34px;height:34px;color:var(--suave);stroke-width:1.5}
.vazio b{font-size:15px} .vazio p{color:var(--suave);font-size:13px;max-width:420px}
.lista .item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--linha)}
.lista .item:last-child{border-bottom:0}
.item small{color:var(--suave);font-size:12px;display:block}
.item .fim{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--suave)}
.form{display:flex;flex-direction:column;gap:12px}
.dica{font-size:12px;color:var(--fraco);font-weight:400}
.aviso{background:var(--acaofundo);border:1px solid var(--acaolinha);border-radius:8px;padding:10px 14px;font-size:13px}
.op{border:1px solid var(--linha);border-radius:8px;padding:10px 12px;background:var(--bg);text-align:left;display:block;width:100%}
.op b{display:block;font-size:13px} .op small{color:var(--suave);font-size:12px}
.op.on{border-color:var(--acao);background:var(--acaofundo)}
.cx{border:1px solid var(--linha);border-radius:7px;padding:10px 12px;min-width:0}
.cx small{display:block;font-size:11px;color:var(--fraco);text-transform:uppercase;font-weight:700;letter-spacing:.04em;margin-bottom:6px}
.cx b{font-size:14px}
.cx td small{text-transform:none;letter-spacing:0;font-weight:400;margin:0;font-size:12px;color:var(--suave)}

/* chats */
.chat{display:grid;grid-template-columns:286px minmax(0,1fr) 260px;height:100vh;margin:-20px -20px -40px;background:var(--bg)}
.chat>div{min-width:0;display:flex;flex-direction:column}
.fila{border-right:1px solid var(--linha);background:var(--painel)}
.fila .topo{padding:10px 10px 0;display:flex;flex-direction:column;gap:8px}
.fila h2{font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;display:flex;gap:6px;align-items:center;color:var(--texto)}
.abas{display:flex;gap:2px;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.abas button{background:none;border:0;padding:10px 12px;font-weight:600;font-size:13px;color:var(--suave);border-bottom:2px solid transparent;margin-bottom:-1px}
.abas button.on{color:var(--texto);border-color:var(--acao)}
.fila .abas{display:grid;grid-template-columns:repeat(3,1fr)} .fila .abas button{font-size:11px;padding:9px 2px}
.fila .chips{padding:10px;border-bottom:1px solid var(--linha);align-items:center;flex-wrap:nowrap;gap:5px} .fila .chips button{border-radius:99px;font-size:11px;padding:3px 8px;white-space:nowrap}
.fila .rol{overflow:auto;flex:1}
.conv{display:flex;gap:9px;padding:10px;border:0;border-bottom:1px solid var(--linha);cursor:pointer;width:100%;background:none;text-align:left}
.conv:hover,.conv.on{background:var(--painel2)}
.conv p{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.conv small{display:block;color:var(--suave);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.fio .topo{padding:10px 16px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:10px;background:var(--painel);flex-wrap:wrap}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.m{max-width:74%;padding:8px 12px;border-radius:10px;font-size:13.5px;background:var(--painel);border:1px solid var(--linha);white-space:pre-line}
.m.eu{align-self:flex-end;background:var(--acaofundo);border-color:var(--acaolinha)}
.m small{display:block;font-size:11px;color:var(--fraco);margin-top:4px;text-align:right}
.compor{display:flex;gap:8px;padding:10px;border-top:1px solid var(--linha);background:var(--painel)}
.compor input{flex:1}
.ficha{border-left:1px solid var(--linha);padding:14px;gap:14px;overflow:auto;background:var(--painel)}
.ficha h3{font-size:11px;color:var(--fraco);letter-spacing:.05em;text-transform:uppercase}
.ficha dl{display:grid;grid-template-columns:auto 1fr;gap:7px 10px;margin:0;font-size:13px}
.ficha dt{color:var(--suave)} .ficha dd{margin:0;text-align:right}
.centro{flex:1;display:grid;place-items:center;text-align:center}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:264px;gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--painel);border:1px solid var(--linha);border-radius:8px;display:flex;flex-direction:column;min-height:440px;transition:border-color .15s,background .15s}
.col.alvo{border-color:var(--acao);background:var(--acaofundo)}
.col h3{font-size:13px;font-weight:700;padding:11px 13px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--cor,var(--acao));border-radius:8px 8px 0 0}
.col h3 span{font-size:12px;color:var(--suave);font-weight:600}
.col .tot{font-size:12px;color:var(--suave);padding:6px 13px 0}
.col .cards{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.kc{background:var(--bg);border:1px solid var(--linha);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:grab;transition:transform .15s,border-color .15s,box-shadow .15s}
.kc:hover{transform:translateY(-2px);border-color:var(--acaolinha);box-shadow:0 6px 16px var(--sombra)}
.kc.arr{opacity:.4}
.kc .l1{display:flex;justify-content:space-between;font-size:13px;font-weight:600}
.kc .l2{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--suave)}
.mini{display:flex;gap:4px} .mini span{flex:1;border-top:3px solid var(--cor);background:var(--bg);border-radius:4px;padding:6px 8px;font-size:11.5px}

/* fluxos */
.duas{display:grid;grid-template-columns:210px minmax(0,1fr)}
.pastas{border-right:1px solid var(--linha);padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.pastas button{background:none;border:0;text-align:left;padding:6px 10px;border-radius:5px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center}
.pastas button.on{background:var(--acao);color:#fff}
.fl td:first-child{border-left:2px solid transparent} .fl tr.at td:first-child{border-left-color:var(--ok)}
.pt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.topoed{background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cv{position:relative}
.canvas{height:620px;background:radial-gradient(circle,var(--painel3) 1px,transparent 1px) 0 0/22px 22px,var(--bg);border:1px solid var(--linha);border-radius:8px;overflow:auto}
.canvas .inner{position:relative;width:1112px;height:600px}
.canvas svg.fios{position:absolute;inset:0;width:1112px;height:600px;pointer-events:none}
.ferr{position:absolute;left:10px;top:10px;z-index:3;width:226px;background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:1px;max-height:540px;overflow:auto;box-shadow:0 12px 30px var(--sombra)}
.ferr button{background:none;border:0;text-align:left;padding:6px 9px;border-radius:6px;display:flex;gap:9px;align-items:center;font-size:12.5px;font-weight:500}
.ferr button:hover{background:var(--painel2)}
.ferr button i{width:9px;height:9px;border-radius:3px;flex:none}
.zoom{position:absolute;left:10px;bottom:10px;z-index:2}
.no{position:absolute;width:200px;background:var(--painel);border:1px solid var(--linha);border-radius:9px;font-size:12.5px;box-shadow:0 4px 14px var(--sombra)}
.no header{display:flex;align-items:center;gap:8px;padding:8px 11px;font-weight:700;border-radius:8px 8px 0 0;background:var(--painel2)}
.no.ini{border:2px solid #22C55E} .no.ini header{background:#22C55E;color:#fff;padding:12px 11px}
.no header i{width:9px;height:9px;border-radius:3px;background:var(--acao)}
.no div{padding:8px 11px;color:var(--suave);height:44px;overflow:hidden}
.no .st{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;height:auto;padding:10px 6px;color:var(--texto)}
.no .st small{display:block;font-size:11px;color:var(--fraco);font-weight:600;letter-spacing:.04em}
.no .st b{font-size:14px}
.no .cnt{font-size:11px;color:var(--fraco);border-top:1px solid var(--linha);padding:6px 11px}

/* agente */
.ag{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;align-items:start}
.migalha{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--suave)}
.teste{display:flex;flex-direction:column;height:580px}
.avs{display:flex;gap:8px;flex-wrap:wrap}
.avs button{width:78px;padding:3px;border-radius:10px;border:2px solid transparent;background:none;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:11px;font-weight:600}
.avs img{width:68px;height:68px;border-radius:8px;display:block}
.mas{border-radius:50%;object-fit:cover;flex:none;background:#0B1120}
.avs button.on{border-color:var(--acao2)}

/* config */
.cfg{display:grid;grid-template-columns:208px minmax(0,1fr);gap:24px;align-items:start}
.cfgm{display:flex;flex-direction:column;gap:1px;border-right:1px solid var(--linha);padding-right:10px}
.cfgm button{background:none;border:0;text-align:left;padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:500;display:flex;gap:9px;align-items:center;white-space:nowrap}
.cfgm button:hover{background:var(--painel2)} .cfgm button.on{background:var(--acao);color:#fff;font-weight:600}
.over{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fraco);font-weight:600}

/* janela */
.veu{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:16px}
.jan{background:var(--painel);border:1px solid var(--linha);border-radius:10px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px var(--sombra)}
.jan.larga{width:min(680px,100%)}
.jan>header{padding:16px 18px 6px} .jan>header h2{font-size:16px;font-weight:700} .jan>header p{color:var(--suave);font-size:13px;margin-top:3px}
.jan .corpo{padding:10px 18px 4px;display:flex;flex-direction:column;gap:12px}
.jan footer{padding:14px 18px;display:flex;justify-content:flex-end;gap:8px}
.menu{position:fixed;background:var(--painel);border:1px solid var(--linha);border-radius:8px;padding:5px;z-index:60;box-shadow:0 12px 30px var(--sombra);display:flex;flex-direction:column;min-width:190px}
.menu button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px}
.menu button:hover{background:var(--painel2)}
.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--painel3);border:1px solid var(--acaolinha);padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:0 10px 30px var(--sombra);z-index:70;max-width:360px}
.qr{width:180px;height:180px;background:#fff;border-radius:8px;padding:12px;display:grid;grid-template-columns:repeat(21,1fr);margin:0 auto}
.qr i{background:#0B1120} .qr i.b{background:transparent}
.menu-cel{display:none}

@media (max-width:1150px){.chat{grid-template-columns:286px minmax(0,1fr)}.ficha{display:none!important}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.ag{grid-template-columns:1fr}}
@media (max-width:860px){

  .lado{position:fixed;inset:0 auto 0 0;width:210px;z-index:40;transform:translateX(-100%);transition:transform .2s;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .lado.aberto{transform:none}
  .menu-cel{display:inline-flex}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g2,.g11,.g3,.cfg,.duas{grid-template-columns:1fr}
  .cfgm,.pastas{border-right:0}

}

 abrirConv(el){const cid=+el.dataset.id;let c=D.convs.find(x=>x.cid===cid);if(!c){if(!D.contatos.some(x=>x.id===cid)){toast('Este contato não existe mais.');return}c={id:D.seq++,cid,fila:'Atendendo',nl:0,msgs:[],robo:null};D.convs.unshift(c)}c.nl=0;S.fila=c.fila;S.chip='Tudo';S.cvId=c.id;salva();if(location.hash==='#chats')render();else location.hash='chats'},
 abrirChat(){fechar();A.abrirConv({dataset:{id:val('ch-cid')}})},
 delContato(el){const id=+el.dataset.id;D.contatos=D.contatos.filter(c=>c.id!==id);D.convs=D.convs.filter(c=>c.cid!==id);D.quadros.forEach(q=>q.cols.forEach(c=>c.cards=c.cards.filter(k=>k.cid!==id)));if(D.fone===id)D.fone=null;salva();pinta();toast('Contato excluído.')},
 exportar(){const csv='nome;telefone;cidade;origem;status;etiquetas\n'+D.contatos.map(c=>[c.nome,c.tel,c.cidade,c.origem,c.status,c.tags.join(',')].join(';')).join('\n');try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='contatos-nexus.csv';document.body.appendChild(a);a.click();a.remove()}catch(e){}toast('Exportação gerada com '+D.contatos.length+' contatos.')},
 salvarVenda(){const c=ct(+val('nv-cid')),p=PROD[val('nv-prod')];if(!c.id||!p)return;D.vendas.unshift({id:D.seq++,cid:c.id,nome:c.nome,tel:c.tel,produto:p[2],valor:p[1],h:new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),inst:val('nv-inst')});c.status='Cliente';c.campos.pedido=val('nv-prod');moveCard(c.id,0,'Ganho',p[2],p[1]);salva();fechar();pinta();toast('Venda registrada: '+c.nome+' · '+brl(p[1]))},
 salvarTag(){const t=val('tg-nome'),c=cvDe(S.cvId);if(!t||!c)return;const p=ct(c.cid);if(!p.tags.includes(t))p.tags.push(t);salva();fechar();pinta();toast('Etiqueta adicionada.')},
 criarKanban(){const n=val('kb-nome');if(!n){toast('Dê um nome ao Kanban.');return}D.quadros.push({n,cols:[{n:'Novo',cor:'#38BDF8',cards:[]},{n:'Qualificação',cor:'#FBBF24',cards:[]},{n:'Ganho',cor:'#34D399',cards:[]}]});salva();fechar();pinta();toast('Kanban criado com 3 colunas.')},
 delKanban(el){D.quadros.splice(+el.dataset.id,1);S.kb=0;salva();pinta();toast('Kanban excluído.')},
 criarColuna(){const n=val('co-nome');if(!n){toast('Dê um nome à coluna.');return}(D.quadros[S.kb]||D.quadros[0]).cols.push({n,cor:val('co-cor'),cards:[]});salva();fechar();pinta();toast('Coluna adicionada.')},
 criarCard(){const c=ct(+val('ca-cid'));if(!c.id)return;(D.quadros[S.kb]||D.quadros[0]).cols[0].cards.unshift({id:D.seq++,cid:c.id,nome:c.nome,sub:val('ca-sub'),valor:+val('ca-valor')||0});salva();fechar();pinta();toast('Card criado.')},
 delCard(el){const id=+el.dataset.id;(D.quadros[S.kb]||D.quadros[0]).cols.forEach(c=>c.cards=c.cards.filter(k=>k.id!==id));salva();pinta();toast('Card excluído.')},
 pausarFluxo(){D.fluxo.ativo=!D.fluxo.ativo;salva();render();fone();toast(D.fluxo.ativo?'Fluxo ativado.':'Fluxo pausado. Lead novo não recebe resposta.')},
 salvarNo(){const n=D.fluxo.nos[S.noEd];if(!n)return;if(n.tipo==='espera'){n.campo=val('no-campo')}else n.itens.forEach((it,i)=>{const v=val('no-'+i);if(v)it.v=v});salva();fechar();toast('Bloco salvo. Vale para o próximo lead de teste.')}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-f]'); if(el){e.preventDefault();const f=A[el.dataset.f];if(f)f(el);return}
 const no=e.target.closest('.canvas .no'); if(no){const i=[...no.parentElement.querySelectorAll('.no')].indexOf(no),k=MAPA[i];if(k==null){toast('O bloco Início só mostra os números do fluxo.');return}S.noEd=k;NX.abrir('editNo');const n=D.fluxo.nos[k];if(n.tipo==='espera'){const c=document.getElementById('no-campo');if(c)c.value=n.campo||''}else n.itens.forEach((it,j)=>{const c=document.getElementById('no-'+j);if(c)c.value=it.v})}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='fFone'){e.preventDefault();const i=document.getElementById('fmsg'),t=i.value.trim();if(!t)return;i.value='';const cv=cvDe(D.fone);if(cv)recebe(cv,t)}
 if(e.target.id==='fMsg2'){e.preventDefault();const i=document.getElementById('msg2'),t=i.value.trim();if(!t)return;i.value='';const c=cvDe(S.cvId);if(!c)return;c.nl=0;if(c.robo&&!c.robo.pausado&&c.robo.no!=null){c.robo.pausado=true;toast('Você respondeu. O robô pausou nesta conversa.')}if(c.fila!=='Atendendo'){c.fila='Atendendo';S.fila='Atendendo'}fala(c,'h','texto',t)}
});
document.addEventListener('input',e=>{const id=e.target.id;if(id!=='qc'&&id!=='qch')return;const q=e.target.value.toLowerCase();document.querySelectorAll(id==='qc'?'#tct tr':'#lch .conv').forEach(r=>{r.hidden=!!q&&!(r.dataset.busca||'').includes(q)})});
let pego=null;
document.addEventListener('dragstart',e=>{const k=e.target.closest&&e.target.closest('.kc');pego=k?+k.dataset.card:null});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col||pego==null||col.dataset.col===undefined)return;const q=D.quadros[S.kb]||D.quadros[0];let k=null;q.cols.forEach(c=>{const i=c.cards.findIndex(x=>x.id===pego);if(i>=0)k=c.cards.splice(i,1)[0]});if(k)q.cols[+col.dataset.col].cards.unshift(k);pego=null;salva();setTimeout(render,0)});

/* ---------- estilo ---------- */
const st=document.createElement('style');
st.textContent=`.toast{bottom:auto!important;top:calc(16px + env(safe-area-inset-top,0px))}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;padding:11px 18px;border-radius:99px;box-shadow:0 10px 30px var(--sombra)}
.fone{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;width:min(360px,calc(100vw - 32px));height:min(600px,calc(100vh - 32px));background:var(--painel);border:1px solid var(--acaolinha);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px var(--sombra)}
.fone header{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--painel2);border-bottom:1px solid var(--linha)}
.fone header b{display:block;font-size:13.5px}.fone header small{display:block;font-size:11.5px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fone .msgs{background:var(--bg)}.fone .m{max-width:86%}
.fone .aj{font-size:13px;color:var(--suave);text-align:center;margin:auto 6px;line-height:1.5}
.fone footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--linha);background:var(--painel2)}
.fone footer span{font-size:11px;color:var(--fraco);flex:1;min-width:120px}.fone footer .bt{padding:5px 10px;font-size:12px}
.lado{overflow-x:hidden}.marca small{white-space:nowrap;letter-spacing:.16em}.lado a.it{font-size:12px;gap:8px;padding:6px 8px}
.canvas .no{cursor:pointer}.canvas .no:hover{border-color:var(--acao)}`;
document.head.appendChild(st);

/* ---------- partida ---------- */
carrega();
D.convs.forEach(c=>{if(c.robo&&c.robo.iniciado&&!c.robo.pausado&&c.robo.no!=null)roda(c)});
render(); fone();
})();

</script><!--/func-->
